<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDREXPREM - Netflix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <button class="back" onclick="goBack()">‹ Back</button>

    <section class="header">
      <div class="netflix-logo">N</div>
      <h1>Netflix</h1>
      <p>Pilih paket yang kamu inginkan</p>
    </section>

    <section class="tiers">
      <article class="tier">
        <div class="tier-top">
          <span class="badge">BASIC</span>
          <h2>Basic</h2>
          <div class="price">Rp5.000</div>
        </div>
        <ul>
          <li>✓ Akses Netflix Basic</li>
          <li>✓ Proses cepat</li>
        </ul>
        <button class="buy" onclick="buyTier('Basic', 5000)">Beli Basic</button>
      </article>

      <article class="tier vip">
        <div class="tier-top">
          <span class="badge">VIP</span>
          <h2>VIP</h2>
          <div class="price">Rp10.000</div>
        </div>
        <ul>
          <li>✓ Akses Netflix VIP</li>
          <li>✓ Prioritas proses</li>
        </ul>
        <button class="buy" onclick="buyTier('VIP', 10000)">Beli VIP</button>
      </article>
    </section>

    <div id="notice" class="notice"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
