<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIND YOUR APP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19; /* Menyamakan warna background gelap */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px; /* Lebar maksimal seperti ukuran layar HP */
            background: #000;
        }
        .app-container iframe {
            position: absolute;
            width: 100%;
            /* Kita buat iframe sedikit lebih tinggi dari 100% lalu digeser ke atas */
            /* Trik ini berfungsi untuk memotong/menyembunyikan bar navigasi bawaan Canva di bagian bawah */
            height: 112%; 
            top: -6%; 
            left: 0;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Parameter &view=1&embed dipadukan untuk tampilan lebih bersih -->
        <iframe loading="lazy" src="https://www.canva.com/design/DAHUfazNI3c/sOATKa0Jiys_bXQaonIprQ/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

</body>
</html>
