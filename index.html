<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIND YOUR APP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a; /* Warna latar belakang halaman */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .wrapper {
            width: 100%;
            max-width: 600px; /* Batas lebar maksimal agar tidak terlalu besar di PC */
            padding: 20px;
        }
        .canva-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 168.6676%; /* Rasio aspek bawaan dari Canva */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        .canva-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
        }
        .footer-credit {
            margin-top: 12px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
        .footer-credit a {
            color: #38bdf8;
            text-decoration: none;
        }
        .footer-credit a:hover {
            text-decoration: underline;
        }
    </style>
</head>
