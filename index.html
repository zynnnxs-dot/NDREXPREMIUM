<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIND YOUR APP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            background: #000;
            overflow: hidden; /* Ini kunci utama agar bagian bawah yang keluar layar tidak terlihat */
        }
        .app-container iframe {
            position: absolute;
            width: 100%;
            /* Memperbesar tinggi iframe dan menggesernya ke atas agar toolbar bawah Canva tersembunyi */
            height: 125%; 
            top: -12%; 
            left: 0;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <iframe loading="lazy" src="https://www.canva.com/design/DAHUfazNI3c/sOATKa0Jiys_bXQaonIprQ/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

</body>
</html>
